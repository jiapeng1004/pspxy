name: CI/CD

on:
  push:
    branches:
      - develop
    tags:
      - '*'

env:
  GOPROXY: https://goproxy.cn,direct

jobs:
  # -------------------- 并行：管理端 SPA / 客户端 SPA --------------------
  build-web-admin:
    name: Build web-admin (React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/web-admin/package-lock.json

      - name: Build admin SPA
        working-directory: frontend/web-admin
        run: |
          npm config set registry https://registry.npmmirror.com
          npm ci
          npm run build

      - name: Upload web-admin dist
        uses: actions/upload-artifact@v4
        with:
          name: web-admin-dist
          path: frontend/web-admin/dist
          retention-days: 14

  build-web-client:
    name: Build web-client (React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/web-client/package-lock.json

      - name: Build client SPA
        working-directory: frontend/web-client
        run: |
          npm config set registry https://registry.npmmirror.com
          npm ci
          npm run build

      - name: Upload web-client dist
        uses: actions/upload-artifact@v4
        with:
          name: web-client-dist
          path: frontend/web-client/dist
          retention-days: 14

  # -------------------- 依赖 web-admin：Runner 编译 Go（利用 go/npm 缓存），镜像仅 Alpine 打包二进制 --------------------
  docker-server:
    name: Build and push server image
    needs: build-web-admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web-admin dist
        uses: actions/download-artifact@v4
        with:
          name: web-admin-dist
          path: tmp-web-admin-dist

      - name: Sync embedded admin SPA
        run: |
          rm -rf internal/embed/admin/dist
          mkdir -p internal/embed/admin/dist
          cp -r tmp-web-admin-dist/. internal/embed/admin/dist/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build server binary (linux amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p docker-server-bundle
          go build -ldflags="-s -w" -o docker-server-bundle/server ./cmd/server
          chmod +x docker-server-bundle/server
          cp config.yaml docker-server-bundle/

      - name: Stage server binary for GitHub Release
        run: |
          mkdir -p release-staging
          cp docker-server-bundle/server release-staging/tcp-proxy-server-linux-amd64

      - name: Upload server binary artifact (linux amd64)
        uses: actions/upload-artifact@v4
        with:
          name: tcp-proxy-server-linux-amd64
          path: release-staging/tcp-proxy-server-linux-amd64
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.cn-hangzhou.aliyuncs.com/jp-java/pspxy
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=ref,event=tag,enable=${{ github.ref_type == 'tag' }}

      - name: Login to Aliyun Container Registry (Hangzhou)
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./docker-server-bundle
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # -------------------- 客户端二进制：仅 Windows / Linux x64（加速 CI；Docker 仍为 linux/amd64）--------------------
  client-binaries:
    name: Build client binary (${{ matrix.name }})
    needs: build-web-client
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
          - name: linux-amd64
            goos: linux
            goarch: amd64
            ext: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web-client dist
        uses: actions/download-artifact@v4
        with:
          name: web-client-dist
          path: tmp-web-client-dist

      - name: Sync embedded client SPA
        run: |
          rm -rf internal/embed/client/dist
          mkdir -p internal/embed/client/dist
          cp -r tmp-web-client-dist/. internal/embed/client/dist/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [ "$TAG" != "$GITHUB_REF" ]; then
            echo "version=$TAG" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build
          go build \
            -ldflags="-s -w -X main.Version=${{ steps.version.outputs.version }}" \
            -o "build/tcp-proxy-client-${{ matrix.name }}${{ matrix.ext }}" \
            ./cmd/client

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcp-proxy-client-${{ matrix.name }}
          path: build/tcp-proxy-client-${{ matrix.name }}${{ matrix.ext }}
          retention-days: 30

  # -------------------- Tag：客户端 + 服务端 linux x64 二进制发布到 GitHub Releases --------------------
  release-client-binaries:
    name: Publish binaries to GitHub Releases
    if: github.ref_type == 'tag'
    needs: [client-binaries, docker-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download client & server binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tcp-proxy-*
          path: release-binaries
          merge-multiple: true

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          working_directory: release-binaries
          files: |
            tcp-proxy-*

  docker-client:
    name: Build and push client image
    needs: client-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download linux-amd64 client binary
        uses: actions/download-artifact@v4
        with:
          name: tcp-proxy-client-linux-amd64
          path: docker-client-bundle

      - name: Prepare image context
        run: |
          set -e
          mkdir -p tmp-bundle
          mv docker-client-bundle/tcp-proxy-client-linux-amd64 tmp-bundle/client
          chmod +x tmp-bundle/client
          cp config-client.example.yaml tmp-bundle/
          rm -rf docker-client-bundle
          mv tmp-bundle docker-client-bundle

      - name: Docker meta (client)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.cn-hangzhou.aliyuncs.com/jp-java/pspxy-client
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=ref,event=tag,enable=${{ github.ref_type == 'tag' }}

      - name: Login to Aliyun Container Registry (Hangzhou)
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: ./docker-client-bundle
          file: ./Dockerfile.client
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
