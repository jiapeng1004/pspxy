name: CI/CD

on:
  push:
    branches:
      - develop
    tags:
      - '*'

env:
  GOPROXY: https://goproxy.cn,direct

jobs:
  # Job 1: 构建并推送 Docker 镜像 → 阿里云 ACR
  # 需在仓库 Secrets 配置：ALIYUN_ACR_USERNAME、ALIYUN_ACR_PASSWORD
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 分支推送（如 develop）：仅打 latest
      # 打 tag：打 latest + 该 tag 名（如 v1.0.0）
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.cn-hangzhou.aliyuncs.com/jp-java/pspxy
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=ref,event=tag,enable=${{ github.ref_type == 'tag' }}

      - name: Login to Aliyun Container Registry (Hangzhou)
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Job 2: 多平台二进制构建
  binaries:
    name: Build Multi-Platform Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ''
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ''
          - name: linux-amd64
            goos: linux
            goarch: amd64
            ext: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build client SPA (web-client)
        run: |
          cd frontend/web-client
          npm config set registry https://registry.npmmirror.com
          npm install
          npm run build

      - name: Sync embedded client SPA
        run: |
          rm -rf internal/embed/client/dist
          mkdir -p internal/embed/client/dist
          cp -r frontend/web-client/dist/* internal/embed/client/dist/

      - name: Set version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [ "$TAG" != "$GITHUB_REF" ]; then
            echo "version=$TAG" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.version }}" -o build/tcp-proxy-client-${{ matrix.name }}${{ matrix.ext }} ./cmd/client

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcp-proxy-client-${{ matrix.name }}
          path: build/tcp-proxy-client-${{ matrix.name }}${{ matrix.ext }}
