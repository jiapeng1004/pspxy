# 客户端多代理示例（写入工作目录时为 config-client.yaml）
version: 1
proxies:
  - id: default
    server_url: ws://127.0.0.1:3000
    proxy_id: ""
    local_port: 10808
    access_key: ""
    secret_key: ""
  # 再增一条时请换不同 local_port 与 proxy_id：
